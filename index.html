<!DOCTYPE html>
<html>
<head>

<title>Family Tree</title>
<meta name="viewport" content="width=device-width, initial-scale=0.7">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    text-align:center;
}

h1{
    color:#333;
    margin-bottom:35px;
}

/* PERSON */

.person{
    background:white;
    padding:10px;
    border-radius:15px;
    box-shadow:0 3px 10px #bbb;
    cursor:pointer;
    transition:0.3s;
    display:inline-block;
}

.person:hover{
    transform:scale(1.05);
}

.person img{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #444;
}

.small img{
    width:70px;
    height:70px;
}

.name{
    font-weight:bold;
    margin-top:8px;
}

/* HIDE */

.hidden{
    display:none;
}

/* FATHER MOTHER */

.parents{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:80px;
    margin:30px 0 60px;
}

/* FIVE SONS */

.sons{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:25px;
    flex-wrap:wrap;
}

/* SON FAMILY */

.family{
    background:white;
    padding:15px;
    border-radius:15px;
    box-shadow:0 3px 10px #ccc;
    min-width:180px;
}

/* HUSBAND WIFE */

.couple{
    display:flex;
    gap:10px;
    justify-content:center;
    align-items:center;
}

/* CHILDREN */

.children{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:30px;
}

/* GRANDCHILD FAMILY */

.gfamily{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* LINE */

.line{
    width:2px;
    height:25px;
    background:#555;
    margin:10px auto;
}

/* D SON */

.dchildren{
    display:flex;
    justify-content:center;
    margin-top:5px;
}

/* MOBILE */

@media(max-width:900px){

    .parents{
        gap:20px;
    }

    .sons{
        flex-direction:column;
        align-items:center;
    }

    .family{
        width:100%;
        max-width:500px;
    }

}

</style>
</head>

<script>
